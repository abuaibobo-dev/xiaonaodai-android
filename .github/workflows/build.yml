name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon -x lint -x test 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT_CODE"
            echo "BUILD_STATUS=failed" >> $GITHUB_OUTPUT
            echo "=== Build Error Log (last 50 lines) ==="
            tail -50 build.log
            exit $BUILD_EXIT_CODE
          fi
          echo "BUILD_STATUS=success" >> $GITHUB_OUTPUT

      - name: List build outputs
        if: always()
        run: |
          echo "=== Build Output Structure ==="
          find app/build/outputs/ -type f -name "*.apk" 2>/dev/null || echo "No APK found in expected location"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug output directory not found"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaonaodai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: success() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          TAG_NAME="latest-apk"
          # Delete existing release if any
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          # Create new release with APK
          gh release create "$TAG_NAME" "$APK_PATH#xiaonaodai-debug.apk" \
            --title "最新APK (自动构建)" \
            --notes "此Release包含最新的调试APK，可直接下载。" \
            --prerelease

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: build.log
          retention-days: 7

