name: User Project Build

on:
  push:
    branches: [ main ]
    paths:
      - 'user-project/**'
  workflow_dispatch:

jobs:
  build-user-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup local.properties for user-project
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > user-project/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build user project (standalone)
        id: build
        run: |
          set -o pipefail
          # 从 user-project 目录独立构建，使用根目录的 gradlew wrapper
          cd user-project
          ../gradlew assembleDebug --no-daemon -x lint -x test 2>&1 | tee ../user-build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "BUILD_STATUS=failed" >> $GITHUB_OUTPUT
            echo "=== User Build Error (last 40 lines) ==="
            tail -40 ../user-build.log
            exit $BUILD_EXIT_CODE
          fi
          echo "BUILD_STATUS=success" >> $GITHUB_OUTPUT

      - name: Upload user project APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: user-project-apk
          path: user-project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: user-build-error-log
          path: user-build.log
          retention-days: 3
