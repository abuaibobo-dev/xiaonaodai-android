name: User Project Build

on:
  push:
    branches: [ main ]
    paths:
      - 'user-project/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-user-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup local.properties for user-project
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > user-project/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build user project (standalone)
        id: build
        run: |
          set -o pipefail
          cd user-project
          ../gradlew assembleDebug --no-daemon -x lint -x test 2>&1 | tee ../user-build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "BUILD_STATUS=failed" >> $GITHUB_OUTPUT
            echo "=== User Build Error (last 50 lines) ==="
            tail -50 ../user-build.log
            exit $BUILD_EXIT_CODE
          fi
          echo "BUILD_STATUS=success" >> $GITHUB_OUTPUT

      - name: List build outputs
        if: always()
        run: |
          echo "=== Build Output Structure ==="
          find user-project/app/build/outputs/ -type f -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -la user-project/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug output directory not found"

      - name: Upload user project APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: user-project-apk
          path: user-project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: success() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="user-project/app/build/outputs/apk/debug/app-debug.apk"
          TAG_NAME="latest-user-apk"
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          gh release create "$TAG_NAME" "$APK_PATH#user-project-debug.apk" \
            --title "最新用户项目APK (自动构建)" \
            --notes "此Release包含最新的用户项目调试APK，可直接下载。" \
            --prerelease

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: user-build-error-log
          path: user-build.log
          retention-days: 7
